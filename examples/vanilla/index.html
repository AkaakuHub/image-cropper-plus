<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScriptの使用例</title>
  </head>
  <body>
    <main>
      <h1>JavaScriptの使用例</h1>
      <label>画像<input id="file" type="file" accept="image/*,.heic,.heif"></label>
      <label><input id="heic" type="checkbox" checked>HEIC変換</label>
      <p id="error" role="alert" hidden></p>
      <div id="stage" class="stage">
        <img id="preview" alt="編集中の画像" draggable="false" hidden>
        <div id="frame" class="frame" hidden></div>
      </div>
      <fieldset id="controls" disabled>
        <label
          >縦横比<select id="aspect">
            <option value="1.7777777777777777">16:9</option>
            <option value="0.5625">9:16</option>
            <option value="1">1:1</option>
            <option value="1.3333333333333333">4:3</option>
          </select></label
        >
        <label>回転<input id="rotation" type="range" min="-180" max="180" value="0"></label>
        <button id="reset-rotation" type="button">回転をリセット</button>
        <label>倍率<input id="zoom" type="range" step="0.01"></label>
        <button id="reset-zoom" type="button">倍率をリセット</button>
        <label
          >出力形式<select id="format">
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
          </select></label
        >
        <button id="complete" type="button">切り抜く</button>
        <button id="skip" type="button">元画像を使用</button>
      </fieldset>
      <a id="download" href="data:," hidden download="crop.jpg"><img id="result" alt="出力画像"></a>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
